services:
  - type: web
    name: ptc-message-bot
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8080
      - key: DISCORD_TOKEN
        sync: false
      - key: FOUNDER_ID
        sync: false
      - key: ADMIN_ROLE_ID
        sync: false
      - key: GUILD_ID
        sync: false

